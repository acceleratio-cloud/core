services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acceleratio
      POSTGRES_PASSWORD: acceleratio
      POSTGRES_DB: acceleratio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceleratio -d acceleratio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
