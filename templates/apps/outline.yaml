schema_version: 1
name: Outline
icon: outline
category: Productivity
tagline: Team knowledge base with real-time editing.
description: |
  Outline is a wiki for teams: nested documents, collaborative editing, search
  and a Markdown-friendly editor.

  It signs users in through an OIDC provider, such as Keycloak from this
  catalog.
features:
  - Real-time collaborative editor
  - Collections with permissions
  - Full-text search
  - Slack and API integrations
license: BSL 1.1
repository: https://github.com/outline/outline
website: https://www.getoutline.com
resources:
  cpu: 1
  memory_mib: 1024
inputs:
  - name: OIDC_CLIENT_ID
    label: OIDC client ID
    placeholder: outline
  - name: OIDC_CLIENT_SECRET
    label: OIDC client secret
  - name: OIDC_AUTH_URI
    label: OIDC authorization URL
    placeholder: https://auth.example.com/realms/team/protocol/openid-connect/auth
  - name: OIDC_TOKEN_URI
    label: OIDC token URL
    placeholder: https://auth.example.com/realms/team/protocol/openid-connect/token
  - name: OIDC_USERINFO_URI
    label: OIDC user info URL
    placeholder: https://auth.example.com/realms/team/protocol/openid-connect/userinfo
services:
  - name: outline
    image: outlinewiki/outline:1.12.0
    icon: outline
    port: 3000
    public: true
    volumes:
      - path: /var/lib/outline/data
        size_gib: 10
    env:
      URL: '${{ app.url }}'
      PORT: 3000
      SECRET_KEY: '${{ hex.secret_key }}'
      UTILS_SECRET: '${{ hex.utils_secret }}'
      DATABASE_URL: 'postgres://${{ service.postgres.user }}:${{ service.postgres.password }}@${{ service.postgres.host }}:5432/${{ service.postgres.database }}'
      PGSSLMODE: disable
      REDIS_URL: 'redis://${{ service.redis.host }}:6379'
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      # TLS ends at the platform's proxy.
      FORCE_HTTPS: false
      OIDC_CLIENT_ID: '${{ input.OIDC_CLIENT_ID }}'
      OIDC_CLIENT_SECRET: '${{ input.OIDC_CLIENT_SECRET }}'
      OIDC_AUTH_URI: '${{ input.OIDC_AUTH_URI }}'
      OIDC_TOKEN_URI: '${{ input.OIDC_TOKEN_URI }}'
      OIDC_USERINFO_URI: '${{ input.OIDC_USERINFO_URI }}'
  - name: postgres
    type: postgres
    icon: postgres
    size_gib: 10
  - name: redis
    image: redis:7.4.12-alpine
    icon: redis
    port: 6379
