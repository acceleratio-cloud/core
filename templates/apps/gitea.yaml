schema_version: 1
name: Gitea
icon: gitea
category: Developer tools
tagline: Git hosting with pull requests, packages and CI runners.
description: |
  Gitea is a lightweight Git forge: repositories, issues, pull requests, a
  package registry and Actions compatible with GitHub workflows.

  It runs as a single Go binary and stays fast on a small server.
features:
  - Pull requests with reviews and protected branches
  - Gitea Actions, compatible with GitHub workflow files
  - Container, npm, Maven and PyPI registries
  - Mirrors of repositories hosted elsewhere
license: MIT
repository: https://github.com/go-gitea/gitea
website: https://about.gitea.com
resources:
  cpu: 1
  memory_mib: 1024
services:
  - name: gitea
    image: gitea/gitea:28.3.0
    icon: gitea
    port: 3000
    public: true
    volumes:
      - path: /data
        size_gib: 20
    env:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__ROOT_URL: '${{ app.url }}'
      GITEA__server__DOMAIN: '${{ app.host }}'
      GITEA__server__SSH_DOMAIN: '${{ app.host }}'
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: '${{ service.postgres.host }}:5432'
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: '${{ password.postgres }}'
  - name: postgres
    image: postgres:17.11-alpine
    icon: postgres
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        size_gib: 10
    env:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      POSTGRES_DB: gitea
      # A subfolder, so initdb never meets a non-empty volume root.
      PGDATA: /var/lib/postgresql/data/pgdata
