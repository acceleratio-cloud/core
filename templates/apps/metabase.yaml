schema_version: 1
name: Metabase
icon: metabase
category: Analytics
tagline: Questions and dashboards over your databases.
description: |
  Metabase lets anyone on the team ask questions of PostgreSQL, MySQL,
  ClickHouse and other databases, with SQL for those who want it.

  Its own settings and saved questions live in a separate PostgreSQL database.
features:
  - Query builder without SQL
  - Native SQL editor with variables
  - Dashboards with filters and subscriptions
  - Embedding in other apps
license: AGPL-3.0
repository: https://github.com/metabase/metabase
website: https://www.metabase.com
resources:
  cpu: 1
  memory_mib: 2048
services:
  - name: metabase
    image: metabase/metabase:v0.65.3.7
    icon: metabase
    port: 3000
    public: true
    env:
      MB_SITE_URL: '${{ app.url }}'
      MB_DB_TYPE: postgres
      MB_DB_HOST: '${{ service.postgres.host }}'
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: '${{ password.postgres }}'
  - name: postgres
    image: postgres:17.11-alpine
    icon: postgres
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        size_gib: 5
    env:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      POSTGRES_DB: metabase
      # A subfolder, so initdb never meets a non-empty volume root.
      PGDATA: /var/lib/postgresql/data/pgdata
