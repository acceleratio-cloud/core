schema_version: 1
name: Mattermost
icon: mattermost
category: Productivity
tagline: Team chat with channels, threads and calls.
description: |
  Mattermost gives a team channels, threads, file sharing and voice calls, with
  message history kept on your own disks.

  Team Edition runs on PostgreSQL and stores files on a volume.
features:
  - Channels, threads and direct messages
  - Voice calls and screen sharing
  - Playbooks for incident response
  - Webhooks, slash commands and bots
license: AGPL-3.0
repository: https://github.com/mattermost/mattermost
website: https://mattermost.com
resources:
  cpu: 2
  memory_mib: 2048
services:
  - name: mattermost
    image: mattermost/mattermost-team-edition:12.0.2
    icon: mattermost
    port: 8065
    public: true
    volumes:
      - path: /mattermost/data
        size_gib: 20
      - path: /mattermost/config
        size_gib: 1
      - path: /mattermost/logs
        size_gib: 1
      - path: /mattermost/plugins
        size_gib: 1
      - path: /mattermost/client/plugins
        size_gib: 1
      - path: /mattermost/bleve-indexes
        size_gib: 1
    env:
      MM_SERVICESETTINGS_SITEURL: '${{ app.url }}'
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: 'postgres://${{ service.postgres.user }}:${{ service.postgres.password }}@${{ service.postgres.host }}:5432/${{ service.postgres.database }}?sslmode=disable&connect_timeout=10'
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
  - name: postgres
    type: postgres
    icon: postgres
    size_gib: 10
