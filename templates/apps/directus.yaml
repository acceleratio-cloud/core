schema_version: 1
name: Directus
icon: directus
category: Content
tagline: Headless CMS and data studio over SQL.
description: |
  Directus puts a REST and GraphQL API and an admin app on top of a SQL
  database, without changing its schema.

  Use it as a headless CMS, an internal tool or a back office.
features:
  - REST and GraphQL APIs
  - Role-based access down to fields
  - Flows for automation
  - File library with image transforms
license: BSL 1.1
repository: https://github.com/directus/directus
website: https://directus.io
resources:
  cpu: 1
  memory_mib: 1024
inputs:
  - name: ADMIN_EMAIL
    label: Admin email
    placeholder: you@example.com
services:
  - name: directus
    image: directus/directus:12.6.1
    icon: directus
    port: 8055
    public: true
    volumes:
      - path: /directus/uploads
        size_gib: 10
      - path: /directus/extensions
        size_gib: 1
    env:
      PUBLIC_URL: '${{ app.url }}'
      KEY: '${{ base64.key }}'
      SECRET: '${{ base64.secret }}'
      ADMIN_EMAIL: '${{ input.ADMIN_EMAIL }}'
      ADMIN_PASSWORD: '${{ password.admin }}'
      DB_CLIENT: pg
      DB_HOST: '${{ service.postgres.host }}'
      DB_PORT: 5432
      DB_DATABASE: '${{ service.postgres.database }}'
      DB_USER: '${{ service.postgres.user }}'
      DB_PASSWORD: '${{ service.postgres.password }}'
      REDIS: 'redis://${{ service.redis.host }}:6379'
      CACHE_ENABLED: true
      CACHE_STORE: redis
      WEBSOCKETS_ENABLED: true
  - name: postgres
    type: postgres
    icon: postgres
    size_gib: 10
  - name: redis
    image: redis:7.4.12-alpine
    icon: redis
    port: 6379
