schema_version: 1
name: NATS JetStream
icon: nats
category: Developer tools
tagline: Messaging and streaming with JetStream, plus a monitoring dashboard.
description: |
  NATS is a messaging server for pub/sub, request/reply and queues. With
  JetStream on, it also keeps streams and key-value buckets on disk.

  Services in the project connect to the nats service on port 4222 with the
  token in its Environment tab (NATS_TOKEN). The web dashboard shows live
  server, connection and JetStream stats. It has no login: anyone with its
  URL can read them.
features:
  - Pub/sub, request/reply and queue groups
  - JetStream streams with replay and acknowledgements
  - Key-value and object stores
  - Web dashboard with live server, connection and JetStream stats
license: Apache 2.0
repository: https://github.com/nats-io/nats-server
website: https://nats.io
resources:
  cpu: 0.5
  memory_mib: 512
services:
  - name: dashboard
    image: mdawar/nats-dashboard:v0.3.1
    icon: nats
    port: 80
    public: true
    # Points the dashboard at its own /proxy/, which Caddy forwards to the
    # nats monitoring port; the browser cannot reach nats directly.
    entrypoint:
      - sh
      - -c
    command:
      - |
        printf '{"server":{"name":"nats","url":"%s/proxy/"},"hideServerInput":true}' "$APP_URL" > /srv/config.json
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    env:
      APP_URL: '${{ app.url }}'
      REVERSE_PROXY_UPSTREAM: '${{ service.nats.host }}:8222'
  - name: nats
    image: nats:2.15.3
    icon: nats
    port: 4222
    volumes:
      - path: /data
        size_gib: 10
    command:
      - --server_name=nats
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
      # Kubernetes fills $(NATS_TOKEN) from the env below.
      - --auth=$(NATS_TOKEN)
    env:
      NATS_TOKEN: '${{ password.nats }}'
