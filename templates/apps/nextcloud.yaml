schema_version: 1
name: Nextcloud
icon: nextcloud
category: Productivity
tagline: Files, calendars and contacts on your own servers.
description: |
  Nextcloud syncs files across desktop and mobile clients and adds calendars,
  contacts and office documents through apps.

  The template uses PostgreSQL for metadata and Redis for file locking.
features:
  - Desktop and mobile sync clients
  - Sharing by link with expiry and password
  - Calendar and contacts over CalDAV and CardDAV
  - Hundreds of apps in its own store
license: AGPL-3.0
repository: https://github.com/nextcloud/server
website: https://nextcloud.com
resources:
  cpu: 2
  memory_mib: 2048
services:
  - name: nextcloud
    image: nextcloud:35.0.2-apache
    icon: nextcloud
    port: 80
    public: true
    volumes:
      - path: /var/www/html
        size_gib: 50
    env:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: '${{ password.admin }}'
      NEXTCLOUD_TRUSTED_DOMAINS: '${{ app.host }}'
      OVERWRITEHOST: '${{ app.host }}'
      OVERWRITEPROTOCOL: https
      POSTGRES_HOST: '${{ service.postgres.host }}'
      POSTGRES_DB: '${{ service.postgres.database }}'
      POSTGRES_USER: '${{ service.postgres.user }}'
      POSTGRES_PASSWORD: '${{ service.postgres.password }}'
      REDIS_HOST: '${{ service.redis.host }}'
  - name: postgres
    type: postgres
    icon: postgres
    size_gib: 10
  - name: redis
    image: redis:7.4.12-alpine
    icon: redis
    port: 6379
