schema_version: 1
name: Keycloak
icon: keycloak
category: Security
tagline: Single sign-on with OIDC, SAML and social logins.
description: |
  Keycloak is an identity provider: user accounts, groups, two-factor login and
  federation with LDAP or social providers.

  Other apps in a project sign users in through it over OIDC or SAML.
features:
  - OIDC and SAML 2.0
  - Two-factor login and passkeys
  - LDAP and Active Directory federation
  - Themes for login pages
license: Apache-2.0
repository: https://github.com/keycloak/keycloak
website: https://www.keycloak.org
resources:
  cpu: 1
  memory_mib: 1024
inputs:
  - name: ADMIN_USER
    label: Admin username
    default: admin
services:
  - name: keycloak
    image: quay.io/keycloak/keycloak:26.8.2
    icon: keycloak
    port: 8080
    public: true
    command:
      - start
    env:
      KC_BOOTSTRAP_ADMIN_USERNAME: '${{ input.ADMIN_USER }}'
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${{ password.admin }}'
      KC_HOSTNAME: '${{ app.url }}'
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: true
      KC_DB: postgres
      KC_DB_URL: 'jdbc:postgresql://${{ service.postgres.host }}:5432/keycloak'
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: '${{ password.postgres }}'
  - name: postgres
    image: postgres:17.11-alpine
    icon: postgres
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        size_gib: 5
    env:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      POSTGRES_DB: keycloak
      # A subfolder, so initdb never meets a non-empty volume root.
      PGDATA: /var/lib/postgresql/data/pgdata
