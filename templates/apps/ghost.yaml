schema_version: 1
name: Ghost
icon: ghost
category: Content
tagline: Publishing platform with newsletters and memberships.
description: |
  Ghost is an editor, a theme engine and a newsletter sender in one, with paid
  memberships through Stripe.

  Posts and members are stored in MySQL; uploaded images on a volume.
features:
  - Card-based editor
  - Newsletters sent from the same post
  - Free and paid memberships
  - Themes in Handlebars
license: MIT
repository: https://github.com/TryGhost/Ghost
website: https://ghost.org
resources:
  cpu: 1
  memory_mib: 1024
services:
  - name: ghost
    image: ghost:6.75.0-alpine
    icon: ghost
    port: 2368
    public: true
    volumes:
      - path: /var/lib/ghost/content
        size_gib: 10
    env:
      url: '${{ app.url }}'
      database__client: mysql
      database__connection__host: '${{ service.mysql.host }}'
      database__connection__user: ghost
      database__connection__password: '${{ password.mysql }}'
      database__connection__database: ghost
  - name: mysql
    image: mysql:8.4.13
    icon: mysql
    port: 3306
    volumes:
      - path: /var/lib/mysql
        size_gib: 10
    env:
      MYSQL_USER: ghost
      MYSQL_PASSWORD: '${{ password.mysql }}'
      MYSQL_DATABASE: ghost
      MYSQL_ROOT_PASSWORD: '${{ password.mysql_root }}'
