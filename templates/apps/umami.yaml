schema_version: 1
name: Umami
icon: umami
category: Analytics
tagline: Simple, privacy-focused analytics on PostgreSQL.
description: |
  Umami tracks page views, events and referrers for any number of sites, without
  cookies.

  It needs only PostgreSQL, which makes it the lightest analytics option in the
  catalog.
features:
  - Unlimited websites per instance
  - Custom events and UTM reports
  - Public share links for dashboards
  - Teams with view-only members
license: MIT
repository: https://github.com/umami-software/umami
website: https://umami.is
resources:
  cpu: 0.5
  memory_mib: 512
services:
  - name: umami
    image: ghcr.io/umami-software/umami:3.4.1
    icon: umami
    port: 3000
    public: true
    env:
      DATABASE_URL: 'postgres://umami:${{ password.postgres }}@${{ service.postgres.host }}:5432/umami'
      APP_SECRET: '${{ hex.app_secret }}'
  - name: postgres
    image: postgres:17.11-alpine
    icon: postgres
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        size_gib: 5
    env:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      POSTGRES_DB: umami
      # A subfolder, so initdb never meets a non-empty volume root.
      PGDATA: /var/lib/postgresql/data/pgdata
