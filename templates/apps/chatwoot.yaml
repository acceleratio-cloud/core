schema_version: 1
name: Chatwoot
icon: chatwoot
category: Productivity
tagline: Shared inbox for website chat, email, WhatsApp and social messages.
description: |
  Chatwoot brings conversations from a website widget, email, WhatsApp,
  Facebook, Instagram, Telegram and more into one inbox for a support team,
  with assignments, canned replies, automations and reports.

  The first visit creates the administrator account. The sidekiq service runs
  background jobs. Attachments are kept in the storage service, which is
  public because browsers download them from it.
features:
  - Website live chat widget
  - Email, WhatsApp, Facebook, Instagram and Telegram inboxes
  - Assignments, labels, canned replies and automations
  - Help center and conversation reports
license: MIT
repository: https://github.com/chatwoot/chatwoot
website: https://www.chatwoot.com
resources:
  cpu: 2
  memory_mib: 3072
services:
  - name: chatwoot
    image: chatwoot/chatwoot:v4.19.1
    icon: chatwoot
    port: 3000
    public: true
    # The entrypoint waits for PostgreSQL; db:chatwoot_prepare creates or migrates the database.
    entrypoint:
      - docker/entrypoints/rails.sh
    command:
      - sh
      - -c
      - bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0
    env:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      RAILS_LOG_TO_STDOUT: true
      FRONTEND_URL: '${{ app.url }}'
      SECRET_KEY_BASE: '${{ hex.secret_key_base }}'
      ENABLE_ACCOUNT_SIGNUP: false
      POSTGRES_HOST: '${{ service.postgres.host }}'
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      REDIS_URL: 'redis://${{ service.redis.host }}:6379'
      REDIS_PASSWORD: '${{ password.redis }}'
      ACTIVE_STORAGE_SERVICE: s3_compatible
      STORAGE_ENDPOINT: '${{ service.storage.url }}'
      STORAGE_BUCKET_NAME: chatwoot
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: true
      STORAGE_ACCESS_KEY_ID: chatwoot
      STORAGE_SECRET_ACCESS_KEY: '${{ password.storage }}'
  - name: sidekiq
    image: chatwoot/chatwoot:v4.19.1
    icon: chatwoot
    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml
    env:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      RAILS_LOG_TO_STDOUT: true
      FRONTEND_URL: '${{ app.url }}'
      SECRET_KEY_BASE: '${{ hex.secret_key_base }}'
      ENABLE_ACCOUNT_SIGNUP: false
      POSTGRES_HOST: '${{ service.postgres.host }}'
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      REDIS_URL: 'redis://${{ service.redis.host }}:6379'
      REDIS_PASSWORD: '${{ password.redis }}'
      ACTIVE_STORAGE_SERVICE: s3_compatible
      STORAGE_ENDPOINT: '${{ service.storage.url }}'
      STORAGE_BUCKET_NAME: chatwoot
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: true
      STORAGE_ACCESS_KEY_ID: chatwoot
      STORAGE_SECRET_ACCESS_KEY: '${{ password.storage }}'
  - name: redis
    image: redis:7.4.12-alpine
    icon: redis
    port: 6379
    volumes:
      - path: /data
        size_gib: 1
    command:
      - redis-server
      - --requirepass
      - $(REDIS_PASSWORD)
    env:
      REDIS_PASSWORD: '${{ password.redis }}'
  # Shared by chatwoot and sidekiq, which separate volumes would split. Public:
  # attachment links redirect browsers to signed URLs on it.
  - name: storage
    image: rustfs/rustfs:1.0.5
    icon: rustfs
    port: 9000
    public: true
    volumes:
      - path: /data
        size_gib: 10
    # Starts RustFS, then creates the bucket (a no-op once it exists).
    entrypoint:
      - sh
      - -c
    command:
      - |
        /entrypoint.sh &
        pid=$!
        trap 'kill -TERM $pid; wait $pid' TERM INT
        until curl -s -o /dev/null http://localhost:9000/; do sleep 1; done
        curl -s -o /dev/null -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "http://localhost:9000/$BUCKET"
        wait $pid
    env:
      BUCKET: chatwoot
      RUSTFS_ACCESS_KEY: chatwoot
      RUSTFS_SECRET_KEY: '${{ password.storage }}'
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: false
  # Chatwoot needs the pgvector extension, which only a superuser can create.
  - name: postgres
    image: pgvector/pgvector:0.8.7-pg17-trixie
    icon: postgres
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        size_gib: 10
    env:
      POSTGRES_DB: chatwoot
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      # The volume's root holds lost+found, which initdb refuses.
      PGDATA: /var/lib/postgresql/data/pgdata
