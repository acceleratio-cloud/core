schema_version: 1
name: Plausible
icon: plausible
category: Analytics
tagline: Website analytics without cookies or personal data.
description: |
  Plausible counts visits, sources and goals with a script under 1 KB, and keeps
  no personal data, so no cookie banner is needed.

  Community Edition stores accounts in PostgreSQL and events in ClickHouse.
features:
  - One-page dashboard per site
  - Goals, funnels and custom properties
  - Google Search Console import
  - Shared links and email reports
license: AGPL-3.0
repository: https://github.com/plausible/analytics
website: https://plausible.io
resources:
  cpu: 2
  memory_mib: 2048
services:
  - name: plausible
    image: ghcr.io/plausible/community-edition:v3.2.1
    icon: plausible
    port: 8000
    public: true
    command:
      - sh
      - -c
      - /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run
    env:
      BASE_URL: '${{ app.url }}'
      SECRET_KEY_BASE: '${{ base64.secret_key_base }}'
      DATABASE_URL: 'postgres://plausible:${{ password.postgres }}@${{ service.postgres.host }}:5432/plausible'
      CLICKHOUSE_DATABASE_URL: 'http://${{ service.clickhouse.host }}:8123/plausible_events_db'
  - name: postgres
    image: postgres:17.11-alpine
    icon: postgres
    port: 5432
    volumes:
      - path: /var/lib/postgresql/data
        size_gib: 5
    env:
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: '${{ password.postgres }}'
      POSTGRES_DB: plausible
      # A subfolder, so initdb never meets a non-empty volume root.
      PGDATA: /var/lib/postgresql/data/pgdata
  - name: clickhouse
    image: clickhouse/clickhouse-server:24.12-alpine
    icon: clickhouse
    port: 8123
    volumes:
      - path: /var/lib/clickhouse
        size_gib: 20
    env:
      CLICKHOUSE_SKIP_USER_SETUP: 1
