name: Release

# Manual release: run it from the Actions tab on `main` and enter a version.
#
#   1. validates the version and that the tag does not exist yet,
#   2. runs the full CI workflow,
#   3. builds and pushes the multi-arch API and console images to GHCR with
#      provenance attestations,
#   4. bumps the default ACCELERATIO_VERSION in deploy/, commits it to main,
#      tags vX.Y.Z and creates the GitHub Release with the installer scripts.
#
# A pre-release publishes versioned images only: no `latest` tag and no change
# to the version that install.sh and update.sh default to.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 0.1.3 or 0.2.0-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Pre-release (no `latest` tag, installer default unchanged)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be started from main (got ${GITHUB_REF})."
          exit 1
      - name: Check version
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version like 1.2.3 or 1.2.3-rc.1 (no leading v)."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  verify:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish ${{ matrix.name }} image
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: console
            dockerfile: apps/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ACCELERATIO_VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Tag and publish release
    needs: [validate, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The exact commit CI ran on. If main has moved on since, the push below
      # is rejected instead of silently releasing something else.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Make the new version the installer default
        if: ${{ !inputs.prerelease }}
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^ACCELERATIO_VERSION="\$\{ACCELERATIO_VERSION:-([^}]+)\}"$/\1/p' deploy/install.sh)"
          if [[ -z "$current" ]]; then
            echo "::error::Could not read the current ACCELERATIO_VERSION from deploy/install.sh."
            exit 1
          fi
          if [[ "$current" != "$VERSION" ]]; then
            export CURRENT="$current" NEXT="$VERSION"
            # Replace only whole version tokens (not 10.1.2 or 0.1.25).
            perl -pi -e 's/(?<![\d.])\Q$ENV{CURRENT}\E(?![\d.])/$ENV{NEXT}/g' \
              deploy/install.sh deploy/install.env.example deploy/README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add deploy/install.sh deploy/install.env.example deploy/README.md
            git commit -m "Release ${VERSION}"
            git push origin HEAD:refs/heads/main
          fi

      - name: Tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Acceleratio ${VERSION}"
          git push origin "refs/tags/v${VERSION}"

      - name: GitHub Release
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p dist
          cp deploy/install.sh deploy/update.sh deploy/uninstall.sh deploy/install.env.example dist/
          (cd dist && sha256sum * > SHA256SUMS)
          {
            echo "## Images"
            echo
            echo '```'
            echo "ghcr.io/${owner}/api:${VERSION}"
            echo "ghcr.io/${owner}/console:${VERSION}"
            echo '```'
            echo
            echo "Install or update with the scripts attached below (checksums in \`SHA256SUMS\`)."
          } > notes.md
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v${VERSION}" dist/* \
            --verify-tag \
            --title "Acceleratio ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
